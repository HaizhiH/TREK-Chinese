name: Build & Push Docker Image

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Force bump line (auto = patch/finalize as today)"
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      confirm_major:
        description: "Type MAJOR (all caps) to confirm a major release"
        type: string
        default: ""

permissions:
  contents: write

env:
  IMAGE_NAME: huahaizhi/trek-chinese
  ACR_IMAGE: ${{ vars.ACR_IMAGE }}

concurrency:
  group: release-build
  cancel-in-progress: false

jobs:
  version-bump:
    if: github.repository == 'HaizhiH/TREK-Chinese' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.VERSION }}
      sha: ${{ steps.bump.outputs.SHA }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate registry configuration
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
          ACR_USERNAME: ${{ vars.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_REDACTED_CREDENTIAL }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ] || \
             [ -z "$ACR_IMAGE" ] || [ -z "$ACR_REGISTRY" ] || \
             [ -z "$ACR_USERNAME" ] || [ -z "$ACR_PASSWORD" ]; then
            echo "::error::Docker Hub credentials and ACR_IMAGE, ACR_REGISTRY, ACR_USERNAME, and ACR_REDACTED_CREDENTIAL must be configured"
            exit 1
          fi

      - name: Determine bump type and update version
        id: bump
        run: |
          git fetch --tags

          # Derive version from git tags — no package.json dependency
          STABLE_TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | grep -v '\-pre\.' | sort -V | tail -1)
          STABLE="${STABLE_TAG#v}"
          STABLE="${STABLE:-$(node -p "require('./package.json').version")}"

          PRE_TAG=$(git tag -l 'v*-pre.*' | sort -V | tail -1)

          BUMP_INPUT="${{ github.event.inputs.bump || 'auto' }}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$STABLE"

          if [ "$BUMP_INPUT" = "major" ]; then
            if [ "${{ github.event.inputs.confirm_major }}" != "MAJOR" ]; then
              echo "::error::confirm_major must equal 'MAJOR' to cut a major release"
              exit 1
            fi
            NEW_VERSION="$((MAJOR + 1)).0.0"
            BUMP="major"
          elif [ "$BUMP_INPUT" = "minor" ]; then
            NEW_VERSION="${MAJOR}.$((MINOR + 1)).0"
            BUMP="minor"
          elif [ "$BUMP_INPUT" = "patch" ]; then
            NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
            BUMP="patch"
          else
            # auto: finalize in-flight prerelease if one exists, else patch
            if [ -n "$PRE_TAG" ]; then
              PRE_BASE="${PRE_TAG#v}"
              PRE_BASE="${PRE_BASE%-pre.*}"
              PRE_MAJOR="$(echo "$PRE_BASE" | cut -d. -f1)"
              # Refuse to auto-finalize a major bump — it bypasses confirm_major
              if [ "$PRE_MAJOR" -gt "$MAJOR" ]; then
                echo "::error::In-flight prerelease $PRE_TAG is a major bump ($STABLE → $PRE_BASE). Use bump=major with confirm_major=MAJOR to finalize."
                exit 1
              fi
              # If prerelease base is strictly greater than stable, finalize it
              HIGHEST=$(printf '%s\n' "$PRE_BASE" "$STABLE" | sort -V | tail -1)
              if [ "$HIGHEST" = "$PRE_BASE" ] && [ "$PRE_BASE" != "$STABLE" ]; then
                NEW_VERSION="$PRE_BASE"
                BUMP="finalize"
              else
                PATCH=$((PATCH + 1))
                NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
                BUMP="patch"
              fi
            else
              PATCH=$((PATCH + 1))
              NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
              BUMP="patch"
            fi
          fi

          echo "Bump type: $BUMP"
          echo "VERSION=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "SHA=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "$STABLE → $NEW_VERSION ($BUMP)"

  build:
    runs-on: ${{ matrix.runner }}
    needs: version-bump
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Prepare platform tag-safe name
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version-bump.outputs.sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to Alibaba Cloud ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_REGISTRY }}
          username: ${{ vars.ACR_USERNAME }}
          password: ${{ secrets.ACR_REDACTED_CREDENTIAL }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,"name=${{ env.IMAGE_NAME }},${{ env.ACR_IMAGE }}",push-by-digest=true,name-canonical=true,push=true
          no-cache: true
          build-args: |
            APP_VERSION=${{ needs.version-bump.outputs.version }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: [version-bump, build]
    outputs:
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version-bump.outputs.sha }}

      - name: Download build digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to Alibaba Cloud ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_REGISTRY }}
          username: ${{ vars.ACR_USERNAME }}
          password: ${{ secrets.ACR_REDACTED_CREDENTIAL }}

      - name: Commit version and atomically push git refs
        id: release
        run: |
          VERSION="${{ needs.version-bump.outputs.version }}"
          npm version "$VERSION" --workspaces --include-workspace-root --no-git-tag-version
          sed -i "s/^version: .*/version: $VERSION/" charts/trek/Chart.yaml
          sed -i "s/^appVersion: .*/appVersion: \"$VERSION\"/" charts/trek/Chart.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json server/package.json client/package.json shared/package.json charts/trek/Chart.yaml
          git commit -m "chore: bump version to $VERSION [skip ci]"
          SHA=$(git rev-parse HEAD)
          git tag -a "v$VERSION" -m "v$VERSION" "$SHA"
          # A protected or advanced main must fail before public image tags change.
          git push --atomic origin HEAD:main "refs/tags/v$VERSION"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Create and push multi-arch manifest
        working-directory: /tmp/digests
        run: |
          VERSION="${{ needs.version-bump.outputs.version }}"
          shopt -s nullglob
          digest_files=(*)
          if [ "${#digest_files[@]}" -ne 2 ]; then
            echo "::error::Expected two architecture digests"
            exit 1
          fi
          MAJOR_TAG="$(echo "$VERSION" | cut -d. -f1)"
          for image in "$IMAGE_NAME" "$ACR_IMAGE"; do
            digests=()
            for digest in "${digest_files[@]}"; do
              if [[ ! -f "$digest" || ! "$digest" =~ ^[0-9a-f]{64}$ ]]; then
                echo "::error::Invalid architecture digest: $digest"
                exit 1
              fi
              digests+=("$image@sha256:$digest")
            done
            docker buildx imagetools create \
              -t "$image:latest" \
              -t "$image:$MAJOR_TAG" \
              -t "$image:$VERSION" \
              "${digests[@]}"
          done

      - name: Inspect manifests
        run: |
          docker buildx imagetools inspect "$IMAGE_NAME:latest"
          docker buildx imagetools inspect "$ACR_IMAGE:latest"

  release-helm:
    runs-on: ubuntu-latest
    needs: [version-bump, merge]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.merge.outputs.sha }}

      - name: Publish Helm chart
        uses: stefanprodan/helm-gh-pages@v1.7.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          charts_dir: charts
          charts_url: https://haizhih.github.io/TREK-Chinese
