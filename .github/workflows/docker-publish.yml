name: Build & Push Docker Image (Continuous)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: huahaizhi/trek-chinese
  ACR_IMAGE: ${{ vars.ACR_IMAGE }}

concurrency:
  group: release-build
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'HaizhiH/TREK-Chinese' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Prepare platform tag-safe name
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Validate registry configuration
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
          ACR_USERNAME: ${{ vars.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_REDACTED_CREDENTIAL }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ] || \
             [ -z "$ACR_IMAGE" ] || [ -z "$ACR_REGISTRY" ] || \
             [ -z "$ACR_USERNAME" ] || [ -z "$ACR_PASSWORD" ]; then
            echo "::error::Docker Hub credentials and ACR_IMAGE, ACR_REGISTRY, ACR_USERNAME, and ACR_REDACTED_CREDENTIAL must be configured"
            exit 1
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to Alibaba Cloud ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_REGISTRY }}
          username: ${{ vars.ACR_USERNAME }}
          password: ${{ secrets.ACR_REDACTED_CREDENTIAL }}

      - name: Read application version
        id: version
        shell: bash
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,"name=${{ env.IMAGE_NAME }},${{ env.ACR_IMAGE }}",push-by-digest=true,name-canonical=true,push=true
          provenance: false
          sbom: false
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download build digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          # Deliberately NOT merged to preserve platform folder structures

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to Alibaba Cloud ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_REGISTRY }}
          username: ${{ vars.ACR_USERNAME }}
          password: ${{ secrets.ACR_REDACTED_CREDENTIAL }}

      - name: Create and push multi-arch manifest
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::12}"
          
          # Build list of digests, enforcing amd64 first
          declare -A platform_digests
          for platform in linux-amd64 linux-arm64; do
            dir="digests-$platform"
            [ -d "$dir" ] || { echo "::error::missing digest artifact for $platform"; exit 1; }
            for f in "$dir"/*; do
              [ -e "$f" ] || { echo "::error::no digest file in $dir"; exit 1; }
              platform_digests[$platform]="$(basename "$f")"
            done
          done

          for image in "$IMAGE_NAME" "$ACR_IMAGE"; do
            digests=()
            for platform in linux-amd64 linux-arm64; do
              digests+=("$image@sha256:${platform_digests[$platform]}")
            done
            
            docker buildx imagetools create \
              -t "$image:latest" \
              -t "$image:sha-$short_sha" \
              "${digests[@]}"
          done

      - name: Inspect manifests
        run: |
          docker buildx imagetools inspect "$IMAGE_NAME:latest"
          docker buildx imagetools inspect "$ACR_IMAGE:latest"
