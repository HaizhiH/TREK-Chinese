name: Build & Push Docker Image (Continuous)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: huahaizhi/trek-chinese
  ACR_IMAGE: ${{ vars.ACR_IMAGE }}

concurrency:
  group: release-build
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'HaizhiH/TREK-Chinese' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Validate registry configuration
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
          ACR_USERNAME: ${{ vars.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_REDACTED_CREDENTIAL }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ] || \
             [ -z "$ACR_IMAGE" ] || [ -z "$ACR_REGISTRY" ] || \
             [ -z "$ACR_USERNAME" ] || [ -z "$ACR_PASSWORD" ]; then
            echo "::error::Docker Hub credentials and ACR_IMAGE, ACR_REGISTRY, ACR_USERNAME, and ACR_REDACTED_CREDENTIAL must be configured"
            exit 1
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to Alibaba Cloud ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_REGISTRY }}
          username: ${{ vars.ACR_USERNAME }}
          password: ${{ secrets.ACR_REDACTED_CREDENTIAL }}

      - name: Set image tags
        id: tags
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::12}"
          {
            echo 'value<<EOF'
            echo "$IMAGE_NAME:latest"
            echo "$IMAGE_NAME:sha-$short_sha"
            echo "$ACR_IMAGE:latest"
            echo "$ACR_IMAGE:sha-$short_sha"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Read application version
        id: version
        shell: bash
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.value }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
