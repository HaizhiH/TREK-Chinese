name: Security Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  scout:
    # Scan same-repository PRs and main pushes. Fork PRs cannot run trusted actions.
    if: github.repository == 'HaizhiH/TREK-Chinese' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: trek:scan

      - uses: docker/scout-action@v1
        with:
          command: cves
          image: trek:scan
          only-severities: critical,high
          only-fixed: true
          exit-code: true
